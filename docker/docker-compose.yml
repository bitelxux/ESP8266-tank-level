version: '3.3'
services:
  influxdb:
    hostname: influxdb
    image: influxdb:1.8
    logging:
          options:
            max-size: "10m"
            max-file: "3"
    restart: always
    environment:
      - INFLUXDB_DB=tank
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin
    ports:
      - 8086:8086
    volumes:
      - ./influxdb:/var/lib/influxdb
  server:
    build: server
    logging:
          options:
            max-size: "10m"
    hostname: server
    restart: always
    volumes:
      - ./scripts:/water_tank
    ports:
      - 8888:8888
      - 8889:8889
    command: /water_tank/start.sh
  grafana:
    #image: grafana/grafana:9.0.7
    image: grafana/grafana:latest
    logging:
          options:
            max-size: "10m"
    hostname: grafana
    restart: always
    volumes:
      - ./grafana-data:/var/lib/grafana
    ports:
      - 3000:3000
    environment:
      - GF_DEFAULT_APP_MODE=production
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=0.1s
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=true
    user: "472"

